# Quick deploy: app + a public HTTPS tunnel in one shot.
#
#   docker compose up --build
#   docker compose logs -f tunnel   # prints the public https URL
#   docker compose logs app | grep password
#
# Set secrets via a .env file or the shell environment (Google keys,
# ENCRYPTION_KEY, etc). With no Google config the server auto-enables a
# printed password login.
services:
  app:
    build: .
    image: ghcr.io/yurifrl/presenter:latest
    restart: unless-stopped
    environment:
      PORT:
      DB_PATH:
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
      GOOGLE_REDIRECT_URI:
      ALLOWED_EMAILS:
      SESSION_SECRET:
      ENCRYPTION_KEY:
      ADMIN_EMAIL:
    volumes:
      - presenter-data:/data
    ports:
      - "7737:7737"

  # Public HTTPS via Cloudflare quick tunnel — zero signup, instant.
  # The URL changes on every restart, so for Google OAuth re-register it (or use
  # a named tunnel with a token). Password login works regardless.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:7737
    depends_on: [app]

volumes:
  presenter-data:
